name: Build LAV Kernel Driver

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install MinGW-w64 Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64

    - name: Compile lavsys.sys (x86_64)
      run: |
        x86_64-w64-mingw32-gcc -std=c99 -Wall -m64 -shared \
            -nostdlib -nostartfiles \
            -Wl,--subsystem,native \
            -Wl,--entry,DriverEntry \
            -Wl,--image-base,0x10000 \
            -Wl,--file-alignment,0x1000 \
            -Wl,--section-alignment,0x1000 \
            -Wl,--nxcompat \
            -Wl,--dynamicbase \
            *.c -o lavsys.sys \
            -lntoskrnl -lhal -lfltMgr

    - name: Upload Built Driver Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lavsys-driver
        path: lavsys.sys